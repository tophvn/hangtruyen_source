<style>
    #leavesCanvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9998;
        pointer-events: none;
        background: transparent;
    }
</style>
<canvas id="leavesCanvas"></canvas>
<script>
    (function () {
        const canvas = document.getElementById("leavesCanvas");
        const ctx = canvas.getContext("2d");
        let cw, ch;

        function resize() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        const leaves = [];
        const colors = ['#D2691E', '#8B4513', '#A0522D', '#CD853F', '#B8860B'];

        class Leaf {
            constructor() {
                this.reset();
                this.y = Math.random() * ch;
            }

            reset() {
                this.x = Math.random() * cw;
                this.y = -20;
                this.size = Math.random() * 15 + 10;
                this.speed = Math.random() * 1.5 + 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = Math.random() * 0.02 - 0.01;
                this.swing = Math.random() * 2;
                this.step = 0;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.step += 0.03) * this.swing;
                this.rotation += this.rotationSpeed;
                if (this.y > ch + 20) this.reset();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;

                // Simple leaf shape
                ctx.beginPath();
                ctx.moveTo(0, -this.size / 2);
                ctx.quadraticCurveTo(this.size / 2, 0, 0, this.size / 2);
                ctx.quadraticCurveTo(-this.size / 2, 0, 0, -this.size / 2);
                ctx.fill();

                // Leaf vein
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, -this.size / 2);
                ctx.lineTo(0, this.size / 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) leaves.push(new Leaf());

        function animate() {
            ctx.clearRect(0, 0, cw, ch);
            leaves.forEach(l => { l.update(); l.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    })();
</script>
